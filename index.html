<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Próximamente… 🌻</title>

<!-- SDK de Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --accent:#ff6b9d;
    --accent-dark:#d6336c;
    --bg-1:#1b2130;
    --bg-2:#0a0c10;
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    background: radial-gradient(circle at 50% -10%, var(--bg-1) 0%, var(--bg-2) 55%, #06080b 100%);
    color:#fff;
    font-family: Georgia, "Times New Roman", serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ============ CONTENIDO CENTRAL ============ */
  .coming{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
    max-width:520px;
    padding:20px;
    animation:fadeIn 1s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(12px); }
    to  { opacity:1; transform:translateY(0); }
  }

  .coming .icon{
    font-size:clamp(56px, 10vw, 84px);
    filter:drop-shadow(0 0 22px rgba(255,107,157,.45));
    animation:float 3.6s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%    { transform:translateY(-10px) rotate(2deg); }
  }

  .coming h1{
    font-size:clamp(22px, 4.5vw, 34px);
    letter-spacing:3px;
    text-transform:uppercase;
    color:#ff8fb0;
    text-shadow:0 2px 20px rgba(255,107,157,.4);
    font-weight:700;
  }

  .coming p{
    font-size:clamp(12px, 1.9vw, 15px);
    color:#8d93a6;
    font-family:-apple-system, sans-serif;
    line-height:1.6;
    max-width:36ch;
  }

  .coming .divider{
    width:70px;
    height:3px;
    background:linear-gradient(90deg, var(--accent), #ff8e53);
    border-radius:3px;
    opacity:.75;
    margin:4px 0;
  }

  .coming .dots{
    display:inline-flex;
    gap:6px;
    margin-top:2px;
  }
  .coming .dots span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--accent);
    opacity:.35;
    animation:dotPulse 1.6s ease-in-out infinite;
  }
  .coming .dots span:nth-child(2){ animation-delay:.25s; }
  .coming .dots span:nth-child(3){ animation-delay:.5s; }
  @keyframes dotPulse{
    0%,100%{ opacity:.25; transform:scale(.85); }
    50%    { opacity:1;   transform:scale(1.15); }
  }

  /* ============ PANEL SECRETO ============ */
  #secret-panel{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(10, 11, 14, 0.96);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:15px;
  }
  .panel-content{
    background:#15171e;
    border:1px solid rgba(255, 183, 3, 0.2);
    width:100%;
    max-width:420px;
    border-radius:18px;
    padding:20px;
    max-height:85vh;
    display:flex;
    flex-direction:column;
    font-family:-apple-system, sans-serif;
    animation:panelPop .35s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes panelPop{
    from{ opacity:0; transform:translateY(14px) scale(.97); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }
  .panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    border-bottom:1px solid rgba(255, 183, 3, 0.15);
    padding-bottom:10px;
  }
  .panel-header h3{
    color:#ffb703;
    font-size:16px;
  }
  .close-btn{
    background:none;
    border:none;
    color:#a3a8b2;
    font-size:22px;
    cursor:pointer;
    line-height:1;
    padding:2px 6px;
    border-radius:6px;
    transition:.2s;
  }
  .close-btn:hover{ color:#fff; background:rgba(255,255,255,.08); }
  .logs-container{
    overflow-y:auto;
    flex-grow:1;
    margin-top:10px;
    border-top:1px solid rgba(255, 255, 255, 0.05);
    padding-top:8px;
  }
  .log-item{
    font-size:12px;
    color:#a3a8b2;
    padding:8px 0;
    border-bottom:1px solid rgba(255, 255, 255, 0.03);
    text-align:left;
  }
  .log-item span{
    color:#f8f9fa;
    display:block;
    margin-top:2px;
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translate(-50%, 20px);
    background:#1b2230;
    color:#fff;
    border:1px solid rgba(255,255,255,.12);
    padding:11px 20px;
    border-radius:26px;
    font-size:13px;
    font-family:-apple-system, sans-serif;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:999;
    box-shadow:0 12px 30px rgba(0,0,0,.6);
    max-width:88vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>

<body>

  <!-- Contenido visible -->
  <div class="coming">
    <div class="icon">🌻</div>
    <div class="divider"></div>
    <h1>Próximamente</h1>
    <p>Vuelve pronto para descubrir más sorpresas.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Panel Secreto (abrir desde consola: abrirPanel()) -->
  <div id="secret-panel">
    <div class="panel-content">
      <div class="panel-header">
        <h3>Panel de Visitas 🌻</h3>
        <button type="button" class="close-btn" onclick="closePanel()">&times;</button>
      </div>
      <p style="font-size:12px; color:#ffb703;">Historial en la nube:</p>
      <div class="logs-container" id="logsList">
        <div class="log-item">Cargando datos...</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
/* ============ CONFIGURACIÓN DE FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAn5_2PGMoB4Qrg_rcrFMqZASI01jqeraQ",
  authDomain: "regaloespecial-c15e4.firebaseapp.com",
  projectId: "regaloespecial-c15e4",
  storageBucket: "regaloespecial-c15e4.firebasestorage.app",
  messagingSenderId: "414868697731",
  appId: "1:414868697731:web:d09c5ef23081548ca761b6"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

/* ============ REGISTRO AUTOMÁTICO DE VISITA (OCULTO) ============ */
window.addEventListener('load', () => {
  const deviceInfo = /Mobi|Android/i.test(navigator.userAgent) ? '📱 Móvil' : '💻 Computadora';
  const now = new Date().toLocaleString('es-VE', { timeZone: 'America/Caracas' });

  db.collection("visitas").add({
    tipo: "Visita a la página",
    dispositivo: deviceInfo,
    fecha: now,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err => console.log(err));
});

/* ============ TOAST ============ */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg){
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

/* ============ PANEL SECRETO: FUNCIONES GLOBALES ============ */
window.abrirPanel = function(){
  const panel = document.getElementById('secret-panel');
  if (panel) panel.style.display = 'flex';
  cargarLogsEnVivo();
  return "Panel abierto correctamente.";
};

window.cerrarPanel = function(){
  const panel = document.getElementById('secret-panel');
  if (panel) panel.style.display = 'none';
  return "Panel cerrado.";
};

window.closePanel = function(){
  window.cerrarPanel();
};

let unsubscribeLogs = null;

function cargarLogsEnVivo(){
  const logsContainer = document.getElementById('logsList');
  if (!logsContainer) return;

  // Evita duplicar listeners si se abre el panel varias veces
  if (unsubscribeLogs){
    try { unsubscribeLogs(); } catch(e){}
    unsubscribeLogs = null;
  }

  unsubscribeLogs = db.collection("visitas")
    .orderBy("timestamp", "desc")
    .limit(30)
    .onSnapshot((snapshot) => {
      let html = '';
      if (snapshot.empty) {
        logsContainer.innerHTML = '<div class="log-item">Aún no hay registros.</div>';
        return;
      }
      snapshot.forEach((doc) => {
        const data = doc.data();
        if (data.tipo === "Visita a la página") {
          html += `<div class="log-item">👀 <b>Visita (${data.dispositivo || 'Dispositivo'})</b><span>${data.fecha || ''}</span></div>`;
        } else {
          html += `<div class="log-item" style="border-left:2px solid #ffb703; padding-left:8px;">💬 <b>Respuesta:</b> "${data.mensaje || ''}"<span>${data.fecha || ''}</span></div>`;
        }
      });
      logsContainer.innerHTML = html;
    }, err => {
      console.warn('Listener visitas:', err);
      logsContainer.innerHTML = '<div class="log-item">Error al cargar registros.</div>';
    });
}

/* Permite cerrar el panel con la tecla Escape */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    const panel = document.getElementById('secret-panel');
    if (panel && panel.style.display === 'flex') window.cerrarPanel();
  }
});
</script>
</body>
</html>
